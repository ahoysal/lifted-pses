dataset:
  root: data/SameDegreeSequence_betti
  num_train: 10000
  num_eval: 10000
  sequence_length: 100
  num_nodes_range: [15, 16]
  edge_prob_range: [0.1, 0.4]
  nswap: 1

model:
  embedded: 64
  heads: 4
  layers: 3
  dropout: 0.1

training:
  epochs: 100
  lr: 0.001
  batch_size: 32
  trials: 3

encoding:
  pe_len: 8
  rwpe_anchors: 16
  rwpe_len: 3

output:
  results_dir: results/betti_correlation
